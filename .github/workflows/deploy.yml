name: Deploy Kivo Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -e

            cd /home/ubuntu/kivo-backend

            git fetch origin
            git reset --hard origin/master

            npm ci --omit=dev

            pm2 restart kivo-backend

            pm2 save

            echo "Kivo backend desplegado correctamente"